<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="com.monutchee.MNCOS.System"/></policy>
  <!-- Every call is additionally authorized against the sender's effective UID.
       Only root and profile-selected service identities may mutate state. -->
  <policy context="default"><allow send_destination="com.monutchee.MNCOS.System"/></policy>
</busconfig>
