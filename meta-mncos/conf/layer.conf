# We have a conf and classes directory, add to BBPATH
MNCOS_LAYERDIR := "${LAYERDIR}"
BBPATH .= ":${LAYERDIR}"
addpylib ${LAYERDIR}/lib mncos

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mncos"
BBFILE_PATTERN_mncos= "^${LAYERDIR}/"
BBFILE_PRIORITY_mncos = "6"

# Optional capability: ordinary MNCOS products do not require meta-selinux.
BBFILES_DYNAMIC += "selinux:${LAYERDIR}/dynamic-layers/selinux/recipes-*/*/*.bbappend \
                    xilinx:${LAYERDIR}/dynamic-layers/xilinx/recipes-*/*/*.bbappend \
                    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bbappend"


LAYERDEPENDS_mncos = "\
    core \
    openembedded-layer \
    meta-python \
    networking-layer \
    webserver \
    "


LAYERSERIES_COMPAT_mncos = "scarthgap"
