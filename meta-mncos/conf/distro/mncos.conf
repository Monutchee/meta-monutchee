require conf/distro/poky.conf

MAINTAINER = "Monutchee lesterlo <lester.lo@monutchee.com>"

unset INIT_MANAGER

require conf/distro/include/default-features.conf

# General parameters
BB_DANGLINGAPPENDS_WARNONLY = "1"
IMAGE_FSTYPES:append=" wic.xz"

# Build performance defaults (common to all MNCOS builds; auto-scale to the
# build host's CPU count). Override per-host in local.conf, e.g. on a machine
# with slow disk IO: BB_NUMBER_THREADS = "4".
BB_NUMBER_THREADS ?= "${@max(1, oe.utils.cpu_count() - 2)}"
PARALLEL_MAKE ?= "-j ${@max(1, oe.utils.cpu_count() - 2)} -l ${@max(1, oe.utils.cpu_count() - 1)}"
BB_FETCH_RETRY ?= "10"


# Distro parameters
DISTRO = "mncos"
DISTRO_NAME = "Monutchee OS"
DISTRO_VERSION = "0.0.1"

# SDK Parameters
SDK_VENDOR = "-mnc"
SDK_VERSION := "0.0.1"
# Fallback if the product layer's layer.conf doesn't set a project name
PROJECT_NAME ??= "${MACHINE}"
CUSTOM_SDK_INSTALL_PATH = "/opt/monutchee/workspace"
SDKPATHINSTALL = "${CUSTOM_SDK_INSTALL_PATH}/${PROJECT_NAME}/${DISTRO}-${MACHINE}-toolchain"
# The eSDK installer takes its default dir from SDKEXTPATH, not SDKPATHINSTALL
SDKEXTPATH = "${SDKPATHINSTALL}"

# Target Parameters
TARGET_VENDOR = "-mnc"


# Default user login
INHERIT += "extrausers"
PASSWD = "\$6\$JhxKZIUcLbr/ojXz\$yDoAFWlulny4bQ9TTghkPzccartwUoN0mU2qZxZ9Ez0fD8/vtkGK1qNFx4/oPHN/POTaDk0EYqZJjvLQYafYY."
EXTRA_USERS_PARAMS = "\
    usermod -p '${PASSWD}' root; \
    "
