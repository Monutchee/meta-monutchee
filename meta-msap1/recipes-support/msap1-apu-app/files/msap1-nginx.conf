worker_processes auto;
pid /run/monutchee/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /run/monutchee/nginx/client_body;
    proxy_temp_path       /run/monutchee/nginx/proxy;
    fastcgi_temp_path     /run/monutchee/nginx/fastcgi;
    uwsgi_temp_path       /run/monutchee/nginx/uwsgi;
    scgi_temp_path        /run/monutchee/nginx/scgi;

    upstream msap1_backend {
        server unix:/run/monutchee/web-backend.sock;
        keepalive 8;
    }

    server {
        include /run/monutchee/nginx/listen.conf;
        server_name _;

        ssl_certificate     /var/lib/monutchee/tls/msap1-web.crt;
        ssl_certificate_key /var/lib/monutchee/tls/msap1-web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:MSAP1_TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root /usr/share/msap1-web;
        index index.html;

        location /api/ {
            proxy_pass http://msap1_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        location = /auth-check {
            internal;
            proxy_pass http://msap1_backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # Completed captures are large immutable files. Let nginx serve them
        # directly, but authorize every request through WebEngine first.
        location ~ ^/protected/waveforms/view/(?<waveform_file>[A-Za-z0-9._-]+\.mncwf)$ {
            auth_request /auth-check;
            alias /data/mnc/waveform/$waveform_file;
            default_type application/x-mncwf;
            add_header Cache-Control "private, no-store";
        }

        location ~ ^/protected/waveforms/download/(?<waveform_file>[A-Za-z0-9._-]+\.mncwf)$ {
            auth_request /auth-check;
            alias /data/mnc/waveform/$waveform_file;
            default_type application/x-mncwf;
            add_header Cache-Control "private, no-store";
            add_header Content-Disposition "attachment; filename=$waveform_file";
        }

        # The Vite entry document points at content-hashed JavaScript and CSS
        # bundles.  Never retain an old copy across an image/application update,
        # otherwise it can keep loading a frontend bundle from the previous
        # deployment until the browser cache is manually cleared.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Vite asset names include a content hash.  Those URLs are immutable:
        # changed content receives a new URL, so a long cache lifetime is safe.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
