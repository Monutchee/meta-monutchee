worker_processes auto;
pid /run/monutchee/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /run/monutchee/nginx/client_body;
    proxy_temp_path       /run/monutchee/nginx/proxy;
    fastcgi_temp_path     /run/monutchee/nginx/fastcgi;
    uwsgi_temp_path       /run/monutchee/nginx/uwsgi;
    scgi_temp_path        /run/monutchee/nginx/scgi;

    upstream msap1_backend {
        server unix:/run/monutchee/web-backend.sock;
        keepalive 8;
    }

    server {
        include /run/monutchee/nginx/listen.conf;
        server_name _;

        ssl_certificate     /var/lib/monutchee/tls/msap1-web.crt;
        ssl_certificate_key /var/lib/monutchee/tls/msap1-web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:MSAP1_TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root /usr/share/msap1-web;
        index index.html;

        location /api/ {
            proxy_pass http://msap1_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        location = /auth-check {
            internal;
            proxy_pass http://msap1_backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
