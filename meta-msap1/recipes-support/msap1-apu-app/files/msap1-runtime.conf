d /run/monutchee       0770 root   msap1-data -
d /run/monutchee/nginx 0750 worker worker     -
d /var/lib/monutchee     0755 root   root       -
d /var/lib/monutchee/tls 0750 worker worker     -
d /data/mnc              0770 root   msap1-data -
d /data/mnc/waveform     0770 root   msap1-data -
d /data/mnc/settings     0700 msap1-settings msap1-settings -
d /data/mnc/database                   0710 root             msap1-data -
d /data/mnc/database/meter-stream      0700 msap1-stream     msap1-data -
d /data/mnc/database/meter-historian   0700 msap1-historian  msap1-data -

# /data is a persistent SD card, so its files carry numeric owners written by
# whichever rootfs created them. The `d` lines above only fix the directory
# itself, which is what let a service-id change leave a correctly-owned
# directory full of unreadable files. These `Z` lines repair the contents
# recursively on every boot, so an id change self-heals instead of taking the
# metering chain down. The `-` mode is deliberate: adjust ownership only and
# leave each file's own permission bits alone.
Z /data/mnc/settings                   - msap1-settings   msap1-settings -
Z /data/mnc/waveform                   - root             msap1-data -
Z /data/mnc/database/meter-stream      - msap1-stream     msap1-data -
Z /data/mnc/database/meter-historian   - msap1-historian  msap1-data -
