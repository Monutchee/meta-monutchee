d /run/monutchee       0770 root   mnc-data -
d /run/monutchee/nginx 0750 mnc-web mnc-web -
d /run/monutchee/mqtt-publisher 0750 mnc-mqtt mnc-settings -
d /run/monutchee/data-sender 0750 mnc-data-sender mnc-data -
d /run/monutchee/waveform-converter 0750 mnc-converter mnc-web -
d /var/lib/monutchee     0755 root   root       -
d /var/lib/monutchee/tls 0750 mnc-web mnc-web -
d /data/mnc              0770 root   mnc-data -
d /data/mnc/waveform     0770 root   mnc-data -
d /data/mnc/settings     0700 mnc-settings mnc-settings -
d /data/mnc/database                   0710 root           mnc-data -
d /data/mnc/database/meter-stream      0700 mnc-stream     mnc-data -
d /data/mnc/database/meter-historian   0700 mnc-historian  mnc-data -
d /data/mnc/data-sender                0700 mnc-data-sender mnc-data -
d /data/mnc/waveform-exports           0700 mnc-converter mnc-converter -

# /data is a persistent SD card, so its files carry numeric owners written by
# whichever rootfs created them. The `d` lines above only fix the directory
# itself, which is what let a service-id change leave a correctly-owned
# directory full of unreadable files. These `Z` lines repair the contents
# recursively on every boot, so an id change self-heals instead of taking the
# metering chain down. The `-` mode is deliberate: adjust ownership only and
# leave each file's own permission bits alone.
Z /data/mnc/settings                   - mnc-settings   mnc-settings -
Z /data/mnc/waveform                   - root           mnc-data -
Z /data/mnc/database/meter-stream      - mnc-stream     mnc-data -
Z /data/mnc/database/meter-historian   - mnc-historian  mnc-data -
Z /data/mnc/data-sender                - mnc-data-sender mnc-data -
Z /data/mnc/waveform-exports           - mnc-converter mnc-converter -
