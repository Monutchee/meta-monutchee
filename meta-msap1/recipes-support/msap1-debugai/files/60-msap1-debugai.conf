# Temporary development-only AI diagnostics account.
#
# The forced command reads SSH_ORIGINAL_COMMAND, accepts only "mnc
# --output json ...", and independently enforces the command metadata access
# policy. These transport restrictions provide defense in depth.
Match User debugai
    AuthenticationMethods password
    PasswordAuthentication yes
    PubkeyAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    ForceCommand /usr/bin/mnc-ssh-gateway
