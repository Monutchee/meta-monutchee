# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
ZUBOARD_LAYERDIR := "${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-zuboard"
BBFILE_PATTERN_meta-zuboard = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-zuboard = "6"

LAYERDEPENDS_meta-zuboard = " \
    core \
    mncos \
    xilinx-addon \
    zynqmp-addon \
    xilinx \
    xilinx-standalone \
    "
LAYERSERIES_COMPAT_meta-zuboard = "scarthgap"

# Project identity, used by meta-mncos for the SDK/eSDK install path
PROJECT_NAME ?= "zudemo"

# ZUBoard routes the microSD slot to ZynqMP SD1/SDHCI1. Keep qemuboot and
# generated boot artifacts aligned with that hardware instead of SD0.
#DEFAULT_HW_BOOT_MODE:zudemo = "5"
QEMU_HW_BOOT_MODE:zudemo = "5"
