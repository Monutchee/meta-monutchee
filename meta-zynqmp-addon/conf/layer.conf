# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
ZYNQMP_ADDON_LAYERDIR := "${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "zynqmp-addon"
BBFILE_PATTERN_zynqmp-addon = "^${LAYERDIR}/"
BBFILE_PRIORITY_zynqmp-addon = "5"

LAYERDEPENDS_zynqmp-addon = "core xilinx openamp-layer virtualization-layer"
LAYERSERIES_COMPAT_zynqmp-addon = "scarthgap"

# ZynqMP/OpenAMP policy shared by product layers.
require conf/xilinx-zynqmp-openamp.conf
